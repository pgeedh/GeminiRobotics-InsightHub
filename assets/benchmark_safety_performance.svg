<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="480" y="42" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Safety performance</text>
  
  <!-- Legend -->
  <g transform="translate(180, 70)" font-size="13" font-weight="500" fill="#374151">
    <circle cx="20" cy="0" r="7" fill="#E3E8EE" />
    <text x="35" y="4">Opus 5</text>
    
    <circle cx="120" cy="0" r="7" fill="#AAB4BE" />
    <text x="135" y="4">GPT 5.6 Sol</text>
    
    <circle cx="250" cy="0" r="7" fill="#88C6FF" />
    <text x="265" y="4">Gemini Robotics ER 1.6</text>
    
    <circle cx="450" cy="0" r="7" fill="#1D4ED8" />
    <text x="465" y="4" font-weight="700" fill="#1D4ED8">Gemini Robotics ER 2.0</text>
  </g>
  
  <!-- Grid lines -->
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="80" y1="120" x2="900" y2="120" />
    <line x1="80" y1="185" x2="900" y2="185" />
    <line x1="80" y1="250" x2="900" y2="250" />
    <line x1="80" y1="315" x2="900" y2="315" />
    <line x1="80" y1="380" x2="900" y2="380" />
    <line x1="80" y1="445" x2="900" y2="445" />
  </g>
  
  <!-- Y-Axis Labels -->
  <g font-size="12" fill="#6B7280" text-anchor="end">
    <text x="70" y="124">100%</text>
    <text x="70" y="189">80%</text>
    <text x="70" y="254">60%</text>
    <text x="70" y="319">40%</text>
    <text x="70" y="384">20%</text>
    <text x="70" y="449">0%</text>
  </g>
  
  <text x="35" y="280" font-size="13" fill="#4B5563" text-anchor="middle" transform="rotate(-90 35 280)">Accuracy</text>
  
  <!-- Group 1: Safety instruction following accuracy -->
  <!-- Base Y = 445. 100% = 325px height. 1% = 3.25px -->
  <g transform="translate(150, 0)">
    <!-- Opus 5: 95.9% -> h=311.7, y=133.3 -->
    <rect x="0" y="133.3" width="70" height="311.7" rx="4" fill="#E3E8EE" />
    <text x="35" y="123" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle">95.9%</text>
    
    <!-- GPT 5.6: 91.4% -> h=297.0, y=148.0 -->
    <rect x="76" y="148.0" width="70" height="297.0" rx="4" fill="#AAB4BE" />
    <text x="111" y="138" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle">91.4%</text>
    
    <!-- ER 1.6: 47.2% -> h=153.4, y=291.6 -->
    <rect x="152" y="291.6" width="70" height="153.4" rx="4" fill="#88C6FF" />
    <text x="187" y="281" font-size="13" font-weight="600" fill="#2563EB" text-anchor="middle">47.2%</text>
    
    <!-- ER 2: 97.9% -> h=318.2, y=126.8 -->
    <rect x="228" y="126.8" width="70" height="318.2" rx="4" fill="#1D4ED8" />
    <text x="263" y="115" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle">97.9%</text>
    
    <text x="149" y="475" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Safety instruction following accuracy</text>
  </g>
  
  <!-- Group 2: Human proximity (1m) -->
  <g transform="translate(530, 0)">
    <!-- Opus 5: 77.1% -> h=250.6, y=194.4 -->
    <rect x="0" y="194.4" width="70" height="250.6" rx="4" fill="#E3E8EE" />
    <text x="35" y="184" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle">77.1%</text>
    
    <!-- GPT 5.6: 83.4% -> h=271.0, y=174.0 -->
    <rect x="76" y="174.0" width="70" height="271.0" rx="4" fill="#AAB4BE" />
    <text x="111" y="164" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle">83.4%</text>
    
    <!-- ER 1.6: 51.1% -> h=166.1, y=278.9 -->
    <rect x="152" y="278.9" width="70" height="166.1" rx="4" fill="#88C6FF" />
    <text x="187" y="268" font-size="13" font-weight="600" fill="#2563EB" text-anchor="middle">51.1%</text>
    
    <!-- ER 2: 93.0% -> h=302.2, y=142.8 -->
    <rect x="228" y="142.8" width="70" height="302.2" rx="4" fill="#1D4ED8" />
    <text x="263" y="131" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle">93.0%</text>
    
    <text x="149" y="475" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Human proximity (1m)</text>
  </g>
</svg>
