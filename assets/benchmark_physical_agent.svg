<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="480" y="42" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Physical agent performance</text>
  
  <!-- Legend -->
  <g transform="translate(320, 75)" font-size="13" font-weight="500" fill="#374151">
    <circle cx="20" cy="0" r="7" fill="#88C6FF" />
    <text x="35" y="4">Gemini Robotics ER 1.6</text>
    
    <circle cx="230" cy="0" r="7" fill="#1D4ED8" />
    <text x="245" y="4" font-weight="700" fill="#1D4ED8">Gemini Robotics ER 2.0</text>
  </g>
  
  <!-- Grid lines -->
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="80" y1="140" x2="900" y2="140" />
    <line x1="80" y1="205" x2="900" y2="205" />
    <line x1="80" y1="270" x2="900" y2="270" />
    <line x1="80" y1="335" x2="900" y2="335" />
    <line x1="80" y1="400" x2="900" y2="400" />
  </g>
  
  <!-- Y-Axis Labels -->
  <g font-size="12" fill="#6B7280" text-anchor="end">
    <text x="70" y="144">80%</text>
    <text x="70" y="209">60%</text>
    <text x="70" y="274">40%</text>
    <text x="70" y="339">20%</text>
    <text x="70" y="404">0%</text>
  </g>
  
  <text x="35" y="270" font-size="13" fill="#4B5563" text-anchor="middle" transform="rotate(-90 35 270)">Success rate</text>
  
  <!-- Bars. Base Y = 400. 80% = 260px height. 1% = 3.25px -->
  <g transform="translate(130, 20)">
    <!-- Category 1: Controlling real VLA -->
    <g transform="translate(0, 0)">
      <!-- ER 1.6: 48.6% -> h=158.0, y=222.0 -->
      <rect x="0" y="222.0" width="100" height="158.0" rx="4" fill="#88C6FF" />
      <text x="50" y="210" font-size="14" font-weight="600" fill="#2563EB" text-anchor="middle">48.6%</text>
      
      <!-- ER 2: 60.0% -> h=195.0, y=185.0 -->
      <rect x="105" y="185.0" width="100" height="195.0" rx="4" fill="#1D4ED8" />
      <text x="155" y="173" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle">60.0%</text>
      
      <text x="102" y="415" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Controlling real VLA</text>
    </g>
    
    <!-- Category 2: Controlling sim VLA -->
    <g transform="translate(260, 0)">
      <!-- ER 1.6: 37.4% -> h=121.6, y=258.4 -->
      <rect x="0" y="258.4" width="100" height="121.6" rx="4" fill="#88C6FF" />
      <text x="50" y="246" font-size="14" font-weight="600" fill="#2563EB" text-anchor="middle">37.4%</text>
      
      <!-- ER 2: 42.9% -> h=139.4, y=240.6 -->
      <rect x="105" y="240.6" width="100" height="139.4" rx="4" fill="#1D4ED8" />
      <text x="155" y="228" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle">42.9%</text>
      
      <text x="102" y="415" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Controlling sim VLA</text>
    </g>
    
    <!-- Category 3: Controlling human tele-op -->
    <g transform="translate(520, 0)">
      <!-- ER 1.6: 63.6% -> h=206.7, y=173.3 -->
      <rect x="0" y="173.3" width="100" height="206.7" rx="4" fill="#88C6FF" />
      <text x="50" y="161" font-size="14" font-weight="600" fill="#2563EB" text-anchor="middle">63.6%</text>
      
      <!-- ER 2: 74.0% -> h=240.5, y=139.5 -->
      <rect x="105" y="139.5" width="100" height="240.5" rx="4" fill="#1D4ED8" />
      <text x="155" y="127" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle">74.0%</text>
      
      <text x="102" y="415" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Controlling human tele-op</text>
    </g>
  </g>
</svg>
