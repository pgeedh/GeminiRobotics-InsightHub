<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%">
  <defs>
    <linearGradient id="clipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .grid-lines { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
      .telemetry-txt { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #38bdf8; }
      .label-txt { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
      
      /* Humanoid Crouch Animation */
      @keyframes crouchMotion {
        0%, 100% { transform: translateY(0px); }
        40%, 60% { transform: translateY(45px); }
      }
      @keyframes leftArmReach {
        0%, 100% { transform: rotate(0deg); }
        45%, 65% { transform: rotate(45deg); }
      }
      @keyframes rightArmReach {
        0%, 100% { transform: rotate(0deg); }
        45%, 65% { transform: rotate(-45deg); }
      }
      @keyframes scanRay {
        0% { opacity: 0.2; transform: scaleY(0.6); }
        50% { opacity: 0.8; transform: scaleY(1.0); }
        100% { opacity: 0.2; transform: scaleY(0.6); }
      }
      @keyframes targetBox {
        0%, 100% { stroke: #f43f5e; }
        50% { stroke: #4ade80; }
      }
      .humanoid-torso { animation: crouchMotion 4s ease-in-out infinite; }
      .arm-l { transform-origin: 155px 120px; animation: leftArmReach 4s ease-in-out infinite; }
      .arm-r { transform-origin: 205px 120px; animation: rightArmReach 4s ease-in-out infinite; }
      .scan-beam { transform-origin: 180px 80px; animation: scanRay 2s ease-in-out infinite; }
      .target-box { animation: targetBox 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Player Frame -->
  <rect width="540" height="320" rx="12" fill="url(#clipBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top UI Bar -->
  <rect x="0" y="0" width="540" height="36" rx="12" fill="#090d16"/>
  <circle cx="20" cy="18" r="4.5" fill="#f43f5e"/>
  <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#f43f5e">LIVE REASONING</text>
  <text x="140" y="22" class="label-txt">Apptronik Apollo 2 — Whole-Body Crouching &amp; Retrieval</text>
  <rect x="465" y="10" width="55" height="16" rx="4" fill="#0284c7"/>
  <text x="473" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">20 FPS</text>

  <!-- Floor Grid (Perspective) -->
  <line x1="40" y1="280" x2="500" y2="280" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="280" x2="140" y2="210" class="grid-lines"/>
  <line x1="180" y1="280" x2="200" y2="210" class="grid-lines"/>
  <line x1="280" y1="280" x2="270" y2="210" class="grid-lines"/>
  <line x1="380" y1="280" x2="340" y2="210" class="grid-lines"/>
  <line x1="480" y1="280" x2="410" y2="210" class="grid-lines"/>

  <!-- Target Tote on Floor -->
  <rect x="140" y="235" width="80" height="42" rx="4" fill="#1e293b" stroke="#f43f5e" stroke-width="2" class="target-box" filter="url(#glowEffect)"/>
  <text x="150" y="260" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f43f5e">TOTE #104</text>

  <!-- 3D Bounding Envelope around Target -->
  <polygon points="140,235 155,220 235,220 220,235" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="220,235 235,220 235,262 220,277" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Humanoid Robot Model (Kinematic Articulation) -->
  <g class="humanoid-torso">
    <!-- Vision Scan Beam -->
    <polygon points="180,85 130,240 230,240" fill="url(#neonCyan)" opacity="0.15" class="scan-beam"/>

    <!-- Head -->
    <rect x="168" y="65" width="24" height="24" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="175" cy="77" r="2.5" fill="#38bdf8" filter="url(#glowEffect)"/>
    <circle cx="185" cy="77" r="2.5" fill="#38bdf8" filter="url(#glowEffect)"/>

    <!-- Torso -->
    <rect x="155" y="95" width="50" height="60" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <line x1="165" y1="115" x2="195" y2="115" stroke="#38bdf8" stroke-width="2"/>
    <line x1="165" y1="130" x2="195" y2="130" stroke="#38bdf8" stroke-width="2"/>

    <!-- Left Arm -->
    <g class="arm-l">
      <rect x="142" y="105" width="12" height="35" rx="4" fill="#1e293b" stroke="#38bdf8"/>
      <circle cx="148" cy="145" r="5" fill="#0284c7"/>
      <rect x="144" y="150" width="8" height="35" rx="3" fill="#38bdf8"/>
      <!-- Gripper Hand -->
      <polygon points="144,185 140,195 156,195 152,185" fill="#06b6d4"/>
    </g>

    <!-- Right Arm -->
    <g class="arm-r">
      <rect x="206" y="105" width="12" height="35" rx="4" fill="#1e293b" stroke="#38bdf8"/>
      <circle cx="212" cy="145" r="5" fill="#0284c7"/>
      <rect x="208" y="150" width="8" height="35" rx="3" fill="#38bdf8"/>
      <!-- Gripper Hand -->
      <polygon points="208,185 204,195 220,195 216,185" fill="#06b6d4"/>
    </g>

    <!-- Hips & Pelvis -->
    <rect x="160" y="155" width="40" height="15" rx="4" fill="#0284c7"/>

    <!-- Left Leg (Bending) -->
    <rect x="162" y="172" width="12" height="40" rx="4" fill="#1e293b" stroke="#0284c7"/>
    <circle cx="168" cy="215" r="5" fill="#38bdf8"/>
    <rect x="164" y="220" width="8" height="45" rx="3" fill="#0f172a" stroke="#0284c7"/>
    <rect x="156" y="265" width="22" height="10" rx="3" fill="#38bdf8"/>

    <!-- Right Leg (Bending) -->
    <rect x="186" y="172" width="12" height="40" rx="4" fill="#1e293b" stroke="#0284c7"/>
    <circle cx="192" cy="215" r="5" fill="#38bdf8"/>
    <rect x="188" y="220" width="8" height="45" rx="3" fill="#0f172a" stroke="#0284c7"/>
    <rect x="182" y="265" width="22" height="10" rx="3" fill="#38bdf8"/>
  </g>

  <!-- Right Side Live Telemetry HUD -->
  <rect x="300" y="55" width="220" height="215" rx="8" fill="#090d16" stroke="#1e293b"/>
  <text x="312" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">ER 2 KINEMATIC PLANNER</text>
  <line x1="312" y1="84" x2="505" y2="84" stroke="#1e293b"/>
  <text x="312" y="104" class="telemetry-txt" fill="#4ade80">● State: WHOLE_BODY_CROUCH</text>
  <text x="312" y="124" class="telemetry-txt">Stance Height: 0.42m</text>
  <text x="312" y="144" class="telemetry-txt">Torso Pitch: 24.5°</text>
  <text x="312" y="164" class="telemetry-txt">CoG Stability Margin: 94%</text>
  <text x="312" y="184" class="telemetry-txt" fill="#f43f5e">Target 3D: [0.15, 0.85, 0.22]</text>
  <text x="312" y="204" class="telemetry-txt" fill="#38bdf8">Dual Arm Force: 14.5 N</text>
  <text x="312" y="224" class="telemetry-txt" fill="#eab308">ASIMOV Safety: VERIFIED</text>
  <text x="312" y="244" class="telemetry-txt">Latency: 205 ms</text>
</svg>
