<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%">
  <defs>
    <linearGradient id="clipBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .telemetry-txt { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #38bdf8; }
      .label-txt { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }

      /* Dual arm synchronized oscillation */
      @keyframes armLeftMove {
        0%, 100% { transform: rotate(-15deg); }
        50% { transform: rotate(10deg); }
      }
      @keyframes armRightMove {
        0%, 100% { transform: rotate(15deg); }
        50% { transform: rotate(-10deg); }
      }
      @keyframes pegInsert {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(18px); }
      }
      .franka-arm-left { transform-origin: 70px 220px; animation: armLeftMove 3.5s ease-in-out infinite; }
      .franka-arm-right { transform-origin: 210px 220px; animation: armRightMove 3.5s ease-in-out infinite; }
      .part-assembly { animation: pegInsert 3.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="540" height="320" rx="12" fill="url(#clipBg3)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top UI Bar -->
  <rect x="0" y="0" width="540" height="36" rx="12" fill="#090d16"/>
  <circle cx="20" cy="18" r="4.5" fill="#38bdf8"/>
  <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">BIMANUAL SYNC</text>
  <text x="140" y="22" class="label-txt">Franka F3 Duo — High-Precision Bimanual Assembly</text>
  <rect x="465" y="10" width="55" height="16" rx="4" fill="#38bdf8"/>
  <text x="473" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">14-DoF</text>

  <!-- Workstation Table -->
  <rect x="30" y="220" width="230" height="50" rx="4" fill="#1e293b" stroke="#334155"/>
  <rect x="125" y="195" width="40" height="25" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>

  <!-- Left Franka Base & Arm -->
  <rect x="55" y="210" width="30" height="15" rx="3" fill="#0284c7"/>
  <g class="franka-arm-left">
    <line x1="70" y1="215" x2="105" y2="150" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
    <circle cx="105" cy="150" r="7" fill="#0284c7"/>
    <line x1="105" y1="150" x2="135" y2="175" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Gripper L -->
    <rect x="130" y="170" width="10" height="18" rx="2" fill="#0f172a" stroke="#38bdf8"/>
  </g>

  <!-- Right Franka Base & Arm -->
  <rect x="195" y="210" width="30" height="15" rx="3" fill="#0284c7"/>
  <g class="franka-arm-right">
    <line x1="210" y1="215" x2="175" y2="150" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
    <circle cx="175" cy="150" r="7" fill="#0284c7"/>
    <line x1="175" y1="150" x2="145" y2="175" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <!-- Gripper R -->
    <rect x="140" y="170" width="10" height="18" rx="2" fill="#0f172a" stroke="#38bdf8"/>
  </g>

  <!-- Assembly Shaft (Animated Insertion) -->
  <g class="part-assembly">
    <rect x="138" y="160" width="14" height="35" rx="3" fill="#f59e0b" stroke="#eab308" filter="url(#blueGlow)"/>
  </g>

  <!-- Right Side Telemetry HUD -->
  <rect x="290" y="55" width="230" height="225" rx="8" fill="#090d16" stroke="#1e293b"/>
  <text x="302" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">BIMANUAL COORDINATOR</text>
  <line x1="302" y1="84" x2="505" y2="84" stroke="#1e293b"/>
  <text x="302" y="104" class="telemetry-txt" fill="#4ade80">● State: COOPERATIVE_INSERTION</text>
  <text x="302" y="124" class="telemetry-txt">Arm 1 (Left): Align &amp; Stabilize</text>
  <text x="302" y="144" class="telemetry-txt">Arm 2 (Right): 6DoF Axial Push</text>
  <text x="302" y="164" class="telemetry-txt" fill="#38bdf8">Internal Force: 3.2 N (Balanced)</text>
  <text x="302" y="184" class="telemetry-txt" fill="#4ade80">Insertion Clearance: 0.15 mm</text>
  <text x="302" y="204" class="telemetry-txt">Peg Engagement: 85%</text>
  <text x="302" y="224" class="telemetry-txt" fill="#eab308">Trajectory Sync: 0.02 rad error</text>
  <text x="302" y="244" class="telemetry-txt">VLA Frequency: 20 Hz</text>
  <text x="302" y="264" class="telemetry-txt">Latency: 195 ms</text>
</svg>
