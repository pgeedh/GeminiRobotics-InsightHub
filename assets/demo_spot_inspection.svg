<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%">
  <defs>
    <linearGradient id="clipBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .telemetry-txt { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #38bdf8; }
      .label-txt { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }

      /* Needle rotation animation */
      @keyframes needleSweep {
        0%, 100% { transform: rotate(-35deg); }
        50% { transform: rotate(45deg); }
      }
      /* Optical Reticle Pulsing */
      @keyframes reticlePulse {
        0%, 100% { transform: scale(1.0); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1.0; }
      }
      .gauge-needle { transform-origin: 150px 160px; animation: needleSweep 3s ease-in-out infinite; }
      .reticle-ring { transform-origin: 150px 160px; animation: reticlePulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="540" height="320" rx="12" fill="url(#clipBg2)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top UI Bar -->
  <rect x="0" y="0" width="540" height="36" rx="12" fill="#090d16"/>
  <circle cx="20" cy="18" r="4.5" fill="#22c55e"/>
  <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#22c55e">METROLOGY OCR</text>
  <text x="140" y="22" class="label-txt">Boston Dynamics Spot — Industrial Gauge Inspection</text>
  <rect x="465" y="10" width="55" height="16" rx="4" fill="#22c55e"/>
  <text x="473" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">98% ACC</text>

  <!-- Industrial Background Pipe Frame -->
  <rect x="50" y="60" width="200" height="20" rx="4" fill="#1e293b" stroke="#334155"/>
  <rect x="140" y="75" width="20" height="35" fill="#334155"/>

  <!-- Analog Pressure Gauge Housing -->
  <circle cx="150" cy="160" r="65" fill="#0f172a" stroke="#475569" stroke-width="6"/>
  <circle cx="150" cy="160" r="56" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>

  <!-- Dial Ticks & Scale -->
  <circle cx="150" cy="160" r="48" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 6"/>
  <text x="135" y="130" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#0f172a">PSI</text>
  <text x="110" y="175" font-family="sans-serif" font-size="9" fill="#64748b">0</text>
  <text x="145" y="120" font-family="sans-serif" font-size="9" fill="#64748b">50</text>
  <text x="178" y="175" font-family="sans-serif" font-size="9" fill="#64748b">100</text>

  <!-- Animated Gauge Needle -->
  <line x1="150" y1="160" x2="150" y2="122" stroke="#ef4444" stroke-width="3" stroke-linecap="round" class="gauge-needle"/>
  <circle cx="150" cy="160" r="5" fill="#0f172a"/>

  <!-- AI Optical Target Reticle & Bounding Box -->
  <circle cx="150" cy="160" r="75" fill="none" stroke="#22c55e" stroke-width="2" class="reticle-ring" stroke-dasharray="10 8" filter="url(#glowGreen)"/>
  <line x1="150" y1="75" x2="150" y2="90" stroke="#22c55e" stroke-width="2"/>
  <line x1="150" y1="230" x2="150" y2="245" stroke="#22c55e" stroke-width="2"/>
  <line x1="65" y1="160" x2="80" y2="160" stroke="#22c55e" stroke-width="2"/>
  <line x1="220" y1="160" x2="235" y2="160" stroke="#22c55e" stroke-width="2"/>

  <!-- Live Value Callout Pill -->
  <rect x="105" y="248" width="90" height="24" rx="6" fill="#090d16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="116" y="264" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#4ade80">42.5 PSI</text>

  <!-- Right Side Inspection Telemetry HUD -->
  <rect x="290" y="55" width="230" height="225" rx="8" fill="#090d16" stroke="#1e293b"/>
  <text x="302" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">SPOT ARM METROLOGY</text>
  <line x1="302" y1="84" x2="505" y2="84" stroke="#1e293b"/>
  <text x="302" y="104" class="telemetry-txt" fill="#4ade80">● Status: TARGET_LOCKED</text>
  <text x="302" y="124" class="telemetry-txt">Instrument: Analog Bourdon</text>
  <text x="302" y="144" class="telemetry-txt">Needle Angle: +14.2°</text>
  <text x="302" y="164" class="telemetry-txt" fill="#38bdf8">Reading: 42.5 ± 0.2 PSI</text>
  <text x="302" y="184" class="telemetry-txt" fill="#4ade80">Nominal Range: 30-60 PSI [OK]</text>
  <text x="302" y="204" class="telemetry-txt">Sight Glass: Clear (No foam)</text>
  <text x="302" y="224" class="telemetry-txt" fill="#eab308">Boston Dynamics API: SYNC</text>
  <text x="302" y="244" class="telemetry-txt">Confidence: 99.4%</text>
  <text x="302" y="264" class="telemetry-txt">Latency: 180 ms</text>
</svg>
