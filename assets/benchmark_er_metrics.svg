<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="480" y="42" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">ER metrics comparison</text>
  
  <!-- Legend -->
  <g transform="translate(100, 70)" font-size="13" font-weight="500" fill="#374151">
    <circle cx="20" cy="0" r="7" fill="#E3E8EE" />
    <text x="35" y="4">Opus 5</text>
    
    <circle cx="120" cy="0" r="7" fill="#AAB4BE" />
    <text x="135" y="4">GPT 5.6 Sol</text>
    
    <circle cx="250" cy="0" r="7" fill="#88C6FF" />
    <text x="265" y="4">Gemini Robotics ER 1.6</text>
    
    <circle cx="450" cy="0" r="7" fill="#3B82F6" />
    <text x="465" y="4">Gemini 3.6 Flash</text>
    
    <circle cx="620" cy="0" r="7" fill="#1D4ED8" />
    <text x="635" y="4" font-weight="700" fill="#1D4ED8">Gemini Robotics ER 2</text>
  </g>
  
  <!-- Grid lines -->
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="80" y1="120" x2="900" y2="120" />
    <line x1="80" y1="185" x2="900" y2="185" />
    <line x1="80" y1="250" x2="900" y2="250" />
    <line x1="80" y1="315" x2="900" y2="315" />
    <line x1="80" y1="380" x2="900" y2="380" />
    <line x1="80" y1="445" x2="900" y2="445" />
  </g>
  
  <!-- Y-Axis Labels -->
  <g font-size="12" fill="#6B7280" text-anchor="end">
    <text x="70" y="124">100%</text>
    <text x="70" y="189">80%</text>
    <text x="70" y="254">60%</text>
    <text x="70" y="319">40%</text>
    <text x="70" y="384">20%</text>
    <text x="70" y="449">0%</text>
  </g>
  
  <text x="35" y="280" font-size="13" fill="#4B5563" text-anchor="middle" transform="rotate(-90 35 280)">Accuracy</text>
  
  <!-- Group 1: Success detection (image-based) -->
  <!-- Base Y = 445. 100% = 325px height. 1% = 3.25px -->
  <g transform="translate(100, 0)">
    <!-- Opus 5: 83.6% -> h=271.7, y=173.3 -->
    <rect x="0" y="173.3" width="28" height="271.7" rx="3" fill="#E3E8EE" />
    <text x="14" y="165" font-size="11" fill="#6B7280" text-anchor="middle">83.6%</text>
    
    <!-- GPT 5.6: 83.1% -> h=270.0, y=175.0 -->
    <rect x="32" y="175.0" width="28" height="270.0" rx="3" fill="#AAB4BE" />
    <text x="46" y="167" font-size="11" fill="#6B7280" text-anchor="middle">83.1%</text>
    
    <!-- ER 1.6: 82.9% -> h=269.4, y=175.6 -->
    <rect x="64" y="175.6" width="28" height="269.4" rx="3" fill="#88C6FF" />
    <text x="78" y="167" font-size="11" fill="#6B7280" text-anchor="middle">82.9%</text>
    
    <!-- Gemini 3.6: 83.3% -> h=270.7, y=174.3 -->
    <rect x="96" y="174.3" width="28" height="270.7" rx="3" fill="#3B82F6" />
    <text x="110" y="166" font-size="11" fill="#6B7280" text-anchor="middle">83.3%</text>
    
    <!-- ER 2: 87.7% -> h=285.0, y=160.0 -->
    <rect x="128" y="160.0" width="28" height="285.0" rx="3" fill="#1D4ED8" />
    <text x="142" y="152" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">87.7%</text>
    
    <text x="78" y="475" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Success detection</text>
    <text x="78" y="493" font-size="11" fill="#6B7280" text-anchor="middle">(image-based)</text>
  </g>
  
  <!-- Group 2: Success detection (video-based) -->
  <g transform="translate(300, 0)">
    <!-- Opus 5: 81.0% -> h=263.2, y=181.8 -->
    <rect x="0" y="181.8" width="28" height="263.2" rx="3" fill="#E3E8EE" />
    <text x="14" y="173" font-size="11" fill="#6B7280" text-anchor="middle">81.0%</text>
    
    <!-- GPT 5.6: 74.7% -> h=242.8, y=202.2 -->
    <rect x="32" y="202.2" width="28" height="242.8" rx="3" fill="#AAB4BE" />
    <text x="46" y="194" font-size="11" fill="#6B7280" text-anchor="middle">74.7%</text>
    
    <!-- ER 1.6: 76.0% -> h=247.0, y=198.0 -->
    <rect x="64" y="198.0" width="28" height="247.0" rx="3" fill="#88C6FF" />
    <text x="78" y="190" font-size="11" fill="#6B7280" text-anchor="middle">76.0%</text>
    
    <!-- Gemini 3.6: 75.4% -> h=245.0, y=200.0 -->
    <rect x="96" y="200.0" width="28" height="245.0" rx="3" fill="#3B82F6" />
    <text x="110" y="192" font-size="11" fill="#6B7280" text-anchor="middle">75.4%</text>
    
    <!-- ER 2: 82.4% -> h=267.8, y=177.2 -->
    <rect x="128" y="177.2" width="28" height="267.8" rx="3" fill="#1D4ED8" />
    <text x="142" y="169" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">82.4%</text>
    
    <text x="78" y="475" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Success detection</text>
    <text x="78" y="493" font-size="11" fill="#6B7280" text-anchor="middle">(video-based)</text>
  </g>
  
  <!-- Group 3: Question answering (ERQA) -->
  <g transform="translate(500, 0)">
    <!-- Opus 5: 67.2% -> h=218.4, y=226.6 -->
    <rect x="0" y="226.6" width="28" height="218.4" rx="3" fill="#E3E8EE" />
    <text x="14" y="218" font-size="11" fill="#6B7280" text-anchor="middle">67.2%</text>
    
    <!-- GPT 5.6: 43.2% -> h=140.4, y=304.6 -->
    <rect x="32" y="304.6" width="28" height="140.4" rx="3" fill="#AAB4BE" />
    <text x="46" y="296" font-size="11" fill="#6B7280" text-anchor="middle">43.2%</text>
    
    <!-- ER 1.6: 72.5% -> h=235.6, y=209.4 -->
    <rect x="64" y="209.4" width="28" height="235.6" rx="3" fill="#88C6FF" />
    <text x="78" y="201" font-size="11" fill="#6B7280" text-anchor="middle">72.5%</text>
    
    <!-- Gemini 3.6: 73.0% -> h=237.2, y=207.8 -->
    <rect x="96" y="207.8" width="28" height="237.2" rx="3" fill="#3B82F6" />
    <text x="110" y="199" font-size="11" fill="#6B7280" text-anchor="middle">73.0%</text>
    
    <!-- ER 2: 78.5% -> h=255.1, y=189.9 -->
    <rect x="128" y="189.9" width="28" height="255.1" rx="3" fill="#1D4ED8" />
    <text x="142" y="181" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">78.5%</text>
    
    <text x="78" y="475" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Question answering</text>
    <text x="78" y="493" font-size="11" fill="#6B7280" text-anchor="middle">(ERQA)</text>
  </g>
  
  <!-- Group 4: Generalized instrument reading -->
  <g transform="translate(700, 0)">
    <!-- Opus 5: 53.0% -> h=172.2, y=272.8 -->
    <rect x="0" y="272.8" width="28" height="172.2" rx="3" fill="#E3E8EE" />
    <text x="14" y="264" font-size="11" fill="#6B7280" text-anchor="middle">53.0%</text>
    
    <!-- GPT 5.6: 61.5% -> h=199.9, y=245.1 -->
    <rect x="32" y="245.1" width="28" height="199.9" rx="3" fill="#AAB4BE" />
    <text x="46" y="237" font-size="11" fill="#6B7280" text-anchor="middle">61.5%</text>
    
    <!-- ER 1.6: 52.8% -> h=171.6, y=273.4 -->
    <rect x="64" y="273.4" width="28" height="171.6" rx="3" fill="#88C6FF" />
    <text x="78" y="265" font-size="11" fill="#6B7280" text-anchor="middle">52.8%</text>
    
    <!-- Gemini 3.6: 52.0% -> h=169.0, y=276.0 -->
    <rect x="96" y="276.0" width="28" height="169.0" rx="3" fill="#3B82F6" />
    <text x="110" y="268" font-size="11" fill="#6B7280" text-anchor="middle">52.0%</text>
    
    <!-- ER 2: 65.7% -> h=213.5, y=231.5 -->
    <rect x="128" y="231.5" width="28" height="213.5" rx="3" fill="#1D4ED8" />
    <text x="142" y="223" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">65.7%</text>
    
    <text x="78" y="475" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Generalized instrument reading</text>
  </g>
</svg>
